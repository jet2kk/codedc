services:
  bot:
    build: .
    container_name: jockie-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - lavalink

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    container_name: jockie-lavalink
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink_plugins:/opt/Lavalink/plugins
    expose:
      - "2333"

volumes:
  lavalink_plugins:
